<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cycle-token" content="__TOKEN__"><title>設計アプリ連携 | Cycle Studio</title>
<link rel="stylesheet" href="/evaluation.css"><script defer src="/design-tools.js"></script></head>
<body>
<header><div><h1>設計アプリ連携</h1><p>設計点の計算条件を受け渡し、個別アプリで再計算できるJSONを作ります。</p></div>
<nav><a href="/">サイクル計算</a><a href="/design-tools/guide">入力項目と計算範囲</a></nav></header>
<main>
<section><h2>入力</h2><form id="exchange">
<div class="grid">
<label>連携機能<select id="tool">
<option value="thrust">インペラーのスラスト・軸締結</option>
<option value="thrust-sensitivity">遠心2段のスラスト力感度分析</option>
<option value="thrust-seal">シール漏れ・キャビティ圧と軸スラスト</option>
<option value="combustor">単管燃焼器</option>
<option value="turbine">軸流タービン・排気ディフューザー</option>
<option value="cooling">二次空気・サイクルへの反映</option>
<option value="oil">油配管・軸受給油</option>
<option value="rotor">ロータダイナミクス</option>
</select></label>
<label id="cycle-label">サイクル入力または結果JSON<input id="cycle-file" type="file" accept=".json,application/json"></label>
</div>
<label class="check" id="demo-label"><input type="checkbox" id="demo-cycle">仮想の2段遠心圧縮機サイクルを使用</label>
<div id="reference-fields" hidden>
<label id="reference-label"><span id="reference-title"></span><input id="reference-file" type="file" accept=".json,application/json"></label>
<label id="oil-condition-label" hidden>RotorLabに渡す給油条件<select id="oil-condition"></select></label>
</div>
<label>連携設定JSON<textarea id="settings" rows="13" required spellcheck="false"></textarea></label>
<div class="actions"><button type="button" id="load-sample">仮想設定を読み込む</button>
<button type="button" id="load-rotating-sample" hidden>回転流路とシールの仮想設定</button>
<button type="button" id="load-coupled-sample" hidden>3段冷却・段間パージの仮想設定</button>
<button type="submit" class="primary">計算する</button></div>
</form><p id="status" role="status"></p></section>
<section id="results" hidden><h2>計算結果</h2><p id="result-note"></p>
<div class="table-scroll" id="summary-table"><table><thead><tr><th>対象</th><th>項目</th><th>値</th></tr></thead><tbody id="summary"></tbody></table></div>
<div class="table-scroll" id="sensitivity-table" hidden><table>
<thead><tr><th scope="col">第1段配分</th><th scope="col">変更条件</th><th scope="col">第1段軸力 [N]</th><th scope="col">第2段軸力 [N]</th><th scope="col">軸受反力 [N]</th><th scope="col">基準との差 [N]</th><th scope="col">継手軸力 [N]（引張正）</th></tr></thead>
<tbody id="sensitivity-rows"></tbody></table></div>
<label>出力するファイル<select id="output-file"></select></label>
<button type="button" id="download">JSONを書出し</button></section>
</main></body></html>
